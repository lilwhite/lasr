name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Validar estructura
        run: |
          echo "=== Validando estructura antes del despliegue ==="
          
          REQUIRED_FILES=(
            "docs/index.html"
            "docs/assets/config.json"
            "docs/assets/content.json"
            "docs/assets/css/styles.css"
            "docs/assets/js/main.js"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Falta archivo $file"
              exit 1
            fi
          done
          
          echo "✓ Estructura validada"

      - name: Validar JSON
        run: |
          python3 -c "import json; json.load(open('docs/assets/config.json'))" && echo "✓ config.json válido"
          python3 -c "import json; json.load(open('docs/assets/content.json'))" && echo "✓ content.json válido"

      - name: Generar metadata de actualización
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "=== Generando docs/assets/build-meta.json ==="
          if [ -f docs/assets/build-meta.json ]; then
            echo "✓ build-meta.json ya existe en repositorio (fuente release/changelog)"
          else
            curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" > /tmp/prs.json
            export PRS_JSON_FILE=/tmp/prs.json
            python3 scripts/build_meta.py
          fi
          python3 -c "import json; json.load(open('docs/assets/build-meta.json'))"

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentacion/package-lock.json

      # El cron diario de prensa dispara este workflow y solo cambia un JSON de
      # docs/. Sin caché, cada día pagaría el build completo de la guía para
      # nada; con ella, un día sin cambios en documentacion/ cuesta lo mismo que
      # antes de existir la guía.
      - name: Restaurar la guía documental compilada
        id: cache-guia
        uses: actions/cache@v4
        with:
          path: documentacion/dist
          key: guia-dist-${{ hashFiles('documentacion/src/**', 'documentacion/public/**', 'documentacion/package-lock.json', 'documentacion/astro.config.mjs', 'documentacion/scripts/**', 'docs/assets/css/tokens.css', 'docs/assets/js/theme-init.js', 'docs/assets/js/theme.js', 'docs/assets/images/og-image.png') }}

      - name: Compilar la guía documental
        if: steps.cache-guia.outputs.cache-hit != 'true'
        working-directory: documentacion
        run: |
          npm ci
          npm run build
          python3 scripts/check_links.py

      - name: Copiar contenido a dist
        run: |
          echo "=== Copiando docs/ a dist/ ==="
          mkdir -p dist
          cp -r docs/* dist/

          # La guía va DESPUÉS del portal: así ningún fichero de docs/ puede
          # pisar la capa documental si algún día coincidieran los nombres.
          echo "=== Colocando la guía documental en dist/documentacion/ ==="
          mkdir -p dist/documentacion
          cp -r documentacion/dist/. dist/documentacion/

          # Crear .nojekyll para evitar procesamiento Jekyll
          touch dist/.nojekyll

          # Un build vacío o a medias no debe llegar a producción en silencio.
          test -f dist/index.html
          test -f dist/documentacion/index.html
          test -f dist/documentacion/cronologia/index.html
          test -f dist/documentacion/documentos/2011-tsjcyl-271/index.html

          echo "✓ Contenido copiado ($(find dist -name '*.html' | wc -l) páginas HTML)"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
