name: Validar contenido

on:
  pull_request:
    branches: [dev, main]
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
      - 'docs/**'
      - 'visual/**'
      - 'chore/**'
  workflow_dispatch:

# Este workflow solo valida: no escribe en el repositorio ni despliega nada.
# Sin este bloque heredaba los permisos por defecto del repositorio, que pueden
# incluir escritura.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar convención de rama de trabajo
        if: github.event_name == 'pull_request' && github.base_ref == 'dev'
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(feature|fix|docs|visual|chore)/[a-z0-9._-]+$ ]]; then
            echo "ERROR: La rama '$BRANCH' no cumple la convención permitida."
            echo "Usa: feature/<slug>, fix/<slug>, docs/<slug>, visual/<slug> o chore/<slug>."
            exit 1
          fi
          echo "✓ Convención de rama válida: $BRANCH"
        
      - name: Validar estructura del proyecto
        run: |
          echo "=== Validando estructura de archivos ==="
          
          # Lista de archivos obligatorios
          REQUIRED_FILES=(
            "docs/index.html"
            "docs/assets/config.json"
            "docs/assets/content.json"
            "docs/assets/build-meta.json"
            "docs/assets/css/styles.css"
            "docs/assets/js/main.js"
            "scripts/build_meta.py"
            "docs/documentacion_relevante.md"
            "docs/assets/css/tokens.css"
            "documentacion/package.json"
            "documentacion/astro.config.mjs"
          )
          
          MISSING_FILES=()
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ $file (FALTA)"
              MISSING_FILES+=("$file")
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo ""
            echo "=== ERROR: Faltan archivos obligatorios ==="
            exit 1
          fi
          
          echo ""
          echo "=== Todos los archivos obligatorios existen ==="
          
      - name: Validar sintaxis JSON
        run: |
          echo "=== Validando JSON ==="
          
          if command -v python3 &> /dev/null; then
            python3 -c "import json; json.load(open('docs/assets/config.json'))" && echo "✓ config.json válido" || exit 1
            python3 -c "import json; json.load(open('docs/assets/content.json'))" && echo "✓ content.json válido" || exit 1
            python3 -c "import json; json.load(open('docs/assets/build-meta.json'))" && echo "✓ build-meta.json válido" || exit 1
          else
            # Fallback: simple check
            echo "Python no disponible, saltando validación JSON"
          fi
          
          echo ""
          echo "=== Validación completada con éxito ==="

  guia-documental:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documentacion/package-lock.json

      # `npm run check` encadena astro check, el build y la validación de
      # enlaces. Ahí es donde se caza una cita a una página inexistente, un ID
      # roto o un enlace sin la base del sitio: fallos del corpus que de otro
      # modo solo aparecerían ya desplegados.
      - name: Validar la guía documental
        working-directory: documentacion
        run: |
          npm ci
          npm run check

      # Los destinos de las tres redirecciones del portal tienen que existir de
      # verdad. Si alguien renombra un tema o una ficha, esto lo dice aquí.
      - name: Comprobar los destinos de las redirecciones
        working-directory: documentacion
        run: |
          for destino in \
            dist/cronologia/index.html \
            dist/temas/recepcion-de-la-urbanizacion/index.html \
            dist/documentos/2011-tsjcyl-271/index.html
          do
            if [ ! -f "$destino" ]; then
              echo "ERROR: falta $destino, al que redirige una página del portal."
              exit 1
            fi
            echo "✓ $destino"
          done

  auditoria-juridica:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 no es opcional. El checkout por defecto es superficial y
      # `gate.py --diff` no podría resolver la base contra la que comparar; sale
      # con 2 en vez de con 0, porque un gate que no puede comparar no es un
      # gate. Sin esto, el paso pasaría a ser un fallo permanente.
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Los PDF se abren con poppler por subprocess, nunca con librería Python.
      # Si falta, el escáner sale con 2 en lugar de saltárselos en silencio.
      - name: Instalar poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Comprobar el propio detector
        run: python3 scripts/legal/test_legal_gate.py

      - name: Comprobar el esquema y el manifiesto
        run: |
          python3 scripts/legal/gate.py --check-schema
          python3 scripts/legal/gate.py --check-manifest

      # Solo sobre lo que la rama toca. Lo preexistente se publica y queda
      # inventariado como deuda: un gate que obligara a clasificar el corpus
      # entero antes del próximo despliegue se desactivaría el primer día.
      - name: Estado jurídico de lo que toca esta rama
        if: github.event_name == 'pull_request'
        run: python3 scripts/legal/gate.py --diff --base origin/${{ github.base_ref }}

      - name: Escaneo determinista
        run: |
          python3 scripts/legal/legal_scan.py \
            --paths docs documentacion/src audit \
            --baseline audit/legal-baseline.json \
            --severity-threshold error
