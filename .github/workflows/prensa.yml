name: Actualizar prensa

on:
  schedule:
    # Cada día a las 07:00 UTC (09:00 hora peninsular)
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch-prensa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Instalar dependencias Python
        run: |
          python3 -m pip install --quiet requests

      - name: Ejecutar fetch de prensa
        run: |
          python3 scripts/prensa/fetch_press.py \
            --config docs/data/prensa/sources.json \
            --output docs/data/prensa/curated_news.json \
            --timeout 15

      # El cron empuja directo a main y auto-dispara el despliegue, sin PR ni
      # revisión humana. Es el único canal de escritura automatizado hacia la
      # rama que se publica, así que las invariantes del fichero se comprueban
      # aquí: si fallan, no se empuja. Ya se coló por esta vía la muerte de una
      # menor y una niña identificada con nombre y apellidos.
      - name: Invariantes del archivo de prensa
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
          node scripts/prensa/filter_regression_check.js
          python3 scripts/legal/legal_scan.py \
            --paths docs/data/prensa \
            --baseline audit/legal-baseline.json \
            --severity-threshold error

      - name: Comprobar si hay cambios
        id: changes
        run: |
          if git diff --quiet docs/data/prensa/curated_news.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Sin cambios en prensa, nada que commitear."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Cambios detectados en curated_news.json."
          fi

      - name: Commit y push a main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/prensa/curated_news.json
          git commit -m "chore(prensa): actualización automática diaria $(date +'%Y-%m-%d')"
          git push origin main

      - name: Disparar despliegue a GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Despliegue de Pages disparado."
